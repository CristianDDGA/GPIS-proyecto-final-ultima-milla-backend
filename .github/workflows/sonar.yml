name: Sonar quality gate
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    # Secrets cannot be read in a job-level if, so this job only reports whether a Sonar server is configured.
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sonar remoto no configurado (faltan SONAR_HOST_URL y SONAR_TOKEN); el análisis se ejecuta en local."
          fi
  sonar:
    # Skipped (not failed) until the repository has a reachable Sonar server, e.g. SonarCloud.
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - name: Generate unit test coverage report
        run: npm run test:unit:coverage
      - name: Validate server configuration
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_HOST_URL" && test -n "$SONAR_TOKEN"
      - name: Analyze and upload to SonarCloud
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # El escáner corre dentro de Docker y no ve el contexto de GitHub: se le pasa explícito
          # para que un PR se analice como PR (y no como la rama principal).
          if [ -n "$PR_NUMBER" ]; then
            set -- "-Dsonar.pullrequest.key=$PR_NUMBER" "-Dsonar.pullrequest.branch=$PR_HEAD_REF" "-Dsonar.pullrequest.base=$PR_BASE_REF" "-Dsonar.scm.revision=$PR_HEAD_SHA"
          else
            set -- "-Dsonar.branch.name=$BRANCH_NAME" "-Dsonar.scm.revision=$GITHUB_SHA"
          fi
          docker run --rm -e SONAR_HOST_URL -e SONAR_TOKEN --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/usr/src" sonarsource/sonar-scanner-cli@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57 "$@"
