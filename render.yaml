# Render Blueprint de la API. Los valores con sync: false se piden al crear el servicio y NO se guardan en git.
services:
  - type: web
    name: logistica-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 24.22.2
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_SSL
        value: require
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_SEND_STATEMENT_TIMEOUT
        value: "false"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: STORAGE_DRIVER
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
