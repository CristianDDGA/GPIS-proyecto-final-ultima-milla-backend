# OWASP ZAP Baseline - reglas para entorno local (Issue #13)
# Formato (separado por TAB): <id-regla>	<IGNORE|WARN|FAIL>	(comentario)
# Se ignoran unicamente hallazgos propios de localhost/HTTP, no de la aplicacion.
10035	IGNORE	(Strict-Transport-Security Header Not Set: localhost no sirve HTTPS; el HSTS se aplica en el proxy TLS de produccion)
10055	IGNORE	(CSP: Failure to Define Directive / Wildcard: la API devuelve JSON, no documentos HTML renderizables)
10020	IGNORE	(Anti-clickjacking Header: respuestas JSON no son enmarcables/renderizables)
90004	IGNORE	(Insufficient Site Isolation Against Spectre: COOP/CORP se configuran en el borde en produccion)
# Reglas que deben mantener el escaneo en rojo si aparecen
40018	FAIL	(SQL Injection)
40012	FAIL	(Cross Site Scripting Reflected)
10021	FAIL	(X-Content-Type-Options Header Missing)
10096	WARN	(Timestamp Disclosure)
10049	WARN	(Storable and Cacheable Content)
10010	WARN	(Cookie No HttpOnly Flag)
10202	WARN	(Absence of Anti-CSRF Tokens)
