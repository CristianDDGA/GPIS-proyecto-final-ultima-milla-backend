# Despliegue local de Millast con Docker: base de datos + API + web.
# Todo con "restart: unless-stopped": si el motor de Docker se reinicia (por ejemplo al encender la PC), los contenedores vuelven solos.
# Uso: powershell -File .\Iniciar-Millast.ps1   (genera los secretos, construye, levanta y crea el administrador)
name: millast_local

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: logistica
      POSTGRES_USER: logistica_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta Iniciar-Millast.ps1 para generar el .env}
      APP_PASSWORD: ${APP_PASSWORD:?Falta APP_PASSWORD}
      WORKER_PASSWORD: ${WORKER_PASSWORD:?Falta WORKER_PASSWORD}
      READONLY_PASSWORD: ${READONLY_PASSWORD:?Falta READONLY_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
      # En el primer arranque crea los roles y aplica TODAS las migraciones (001 a 020).
      - ./db-package/database/init:/docker-entrypoint-initdb.d:ro
      - ./db-package/database:/workspace/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U logistica_admin -d logistica"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    shm_size: 128mb
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_lock_waits=on"]

  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://logistica_app:${APP_PASSWORD}@db:5432/logistica
      DB_SSL: disable
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      # Solo se aceptan peticiones del navegador que vengan de la web local (y su gemelo localhost/127.0.0.1).
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
      # En local no hay bandeja de correo: false = las cuentas nuevas entran sin código. Ponlo en true si configuras SMTP.
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      STORAGE_DRIVER: disk
      COURIER_UPLOADS_DIR: /data/courier
      PRODUCT_UPLOADS_DIR: /data/products
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - uploads:/data
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ${FRONTEND_DIR:-../../../GPIS-proyecto-final-ultima-milla-frontend}
      dockerfile: ${WEB_DOCKERFILE:?Ejecuta Iniciar-Millast.ps1 para generar el .env}
      additional_contexts:
        cfg: .
      args:
        # Vite incrusta estas dos al COMPILAR: si cambias el puerto de la API, reconstruye con --build.
        VITE_API_BASE_URL: http://localhost:${API_PORT:-3000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"

volumes:
  pgdata:
  uploads:
